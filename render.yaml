services:
  - type: web
    name: clearsky-ai-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./clearsky.db
      - key: GEMINI_API_KEY
        sync: false
      - key: AQI_CACHE_TTL_SECONDS
        value: "900"
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'
